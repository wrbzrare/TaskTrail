<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskTrail - Проекты</title>
	<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
	<link rel="stylesheet" href="{{ url_for('static', filename='css/projects.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">

        <!-- Хэдер (как на index.html) -->
        <header class="header">
			<div class="header-left">
				<img src="{{ url_for('static', filename='img/logo.png') }}" alt="TaskTrail" class="logo">
				<span class="site-name">TaskTrail</span>
			</div>
			<div class="header-right" onclick="window.location='/profile'">
				<div class="user-profile">
					<i class="fas fa-user"></i>
					<span>Профиль</span>
				</div>
			</div>
		</header>

        <div class="main-content">
            <!-- Боковое меню (как на index.html) -->
            <nav class="sidebar">
                <ul class="nav-links">
                    <li class="nav-item">
                        <a href="/">
                            <i class="fas fa-home"></i>
                            <span>Главная</span>
                        </a>
                    </li>
                    <li class="nav-item active">
                        <a href="/projects">
                            <i class="fas fa-project-diagram"></i>
                            <span>Проекты</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="/tasks">
                            <i class="fas fa-tasks"></i>
                            <span>Задачи</span>
                        </a>
                    </li>
                </ul>
            </nav>

            <!-- Основной контент -->
            <main class="content">
			<div class="page-header">
				<h1>Проекты</h1>
				<button id="create-project-btn" class="create-project-btn" style="display:none;">
					<i class="fas fa-plus"></i> Новый проект
				</button>
			</div>
			<div id="projects-container"></div>
			</main>
    </div>

    <!-- Футер -->
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-info">
                <p>Сервис управления проектами</p>
            </div>
            <div class="footer-support">
                <h4>Техническая поддержка</h4>
                <p>tasktrail@gmail.com</p>
                <p></p>
            </div>
        </div>
    </footer>
	
	<script src="{{ url_for('static', filename='js/projects.js') }}"></script>
</body>
</html>
